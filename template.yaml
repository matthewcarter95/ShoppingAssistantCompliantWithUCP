AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UCP Shopping Assistant Chatbot

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11

Parameters:
  OpenAIApiKey:
    Type: String
    Description: OpenAI API Key
    NoEcho: true

  FrontendUrl:
    Type: String
    Description: Frontend Amplify URL for CORS
    Default: https://main.d7stwkdmkar4g.amplifyapp.com

  PactBrandCardUrl:
    Type: String
    Default: ""
    Description: >
      The merchant agent's Agent Card URL (e.g. https://smitty-api.demo-connect.us/.well-known/agent-card.json).
      Empty turns the check_orders tool off.
  PactAudience:
    Type: String
    Default: ""
    Description: The audience the merchant's Provider assigned to this assistant at registration (e.g. https://smitty-api.demo-connect.us/a2a).

  PactSsmPrefix:
    Type: String
    Description: SSM parameter prefix holding the PACT signing key and sub secret (must start with /)
    Default: /shopping-assistant/pact
    AllowedPattern: "^/[A-Za-z0-9_./-]+[^/]$"

Resources:
  # DynamoDB Table for conversation sessions
  ConversationSessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ConversationSessions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: session_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SessionIdIndex
          KeySchema:
            - AttributeName: session_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Lambda Function
  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: shopping-assistant-chatbot
      Handler: src.chatbot.main.lambda_handler
      CodeUri: .
      Runtime: python3.11
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          UCP_BASE_URL: https://n5je6mqzsskozc32cqdfetl42q0augte.lambda-url.us-east-1.on.aws/
          UCP_AGENT_PROFILE: https://gscfl7ajbg3tudkoygerso7grq0epohi.lambda-url.us-east-1.on.aws/agent-profile
          CHATBOT_MODEL: gpt-3.5-turbo
          DYNAMODB_TABLE: !Ref ConversationSessionsTable
          LOG_LEVEL: INFO
          # Shopping Assistant Auth0
          SHOPPING_ASSISTANT_AUTH0_DOMAIN: grocery-b2c.cic-demo-platform.auth0app.com
          # Merchant OAuth
          MERCHANT_AUTH0_DOMAIN: auth0connectedapps.demo-connect.us
          MERCHANT_AUTH0_CLIENT_ID: PX3u5zLgnC39WzYFnGU6Aval5V9xabGd
          MERCHANT_AUTH0_AUDIENCE: api://ucp.session.service
          MERCHANT_AUTH0_SCOPE: "openid profile email mock.ucp.shopping.checkout:manage mock.ucp.shopping.checkout:complete"
          # Chatbot base URL (Lambda Function URL) - used for OAuth callback
          CHATBOT_BASE_URL: https://gscfl7ajbg3tudkoygerso7grq0epohi.lambda-url.us-east-1.on.aws
          # Frontend URL for CORS and post-OAuth redirects
          FRONTEND_URL: !Ref FrontendUrl
          # PACT personal-agent identity. Issuer is CHATBOT_BASE_URL (the Function URL).
          # Both values are SSM SecureStrings created by scripts/gen_pact_key.py --store.
          PACT_BRAND_CARD_URL: !Ref PactBrandCardUrl
          PACT_AUDIENCE: !Ref PactAudience
          PACT_KEY_SSM_PARAMETER: !Sub "${PactSsmPrefix}/private-jwk"
          PACT_SUB_SECRET_SSM_PARAMETER: !Sub "${PactSsmPrefix}/sub-secret"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationSessionsTable
        # Read only the two PACT parameters. SecureStrings under the default aws/ssm key
        # decrypt with the caller's SSM access; no separate kms:Decrypt grant is needed.
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PactSsmPrefix}/private-jwk"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PactSsmPrefix}/sub-secret"
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref FrontendUrl
            - "http://localhost:8000"
          AllowMethods:
            - "*"
          AllowHeaders:
            - "*"
          AllowCredentials: true
          MaxAge: 300

Outputs:
  ChatbotFunctionUrl:
    Description: Function URL for Chatbot API
    Value: !GetAtt ChatbotFunctionUrl.FunctionUrl

  DynamoDBTable:
    Description: DynamoDB Table Name
    Value: !Ref ConversationSessionsTable
